{{ define "main" }}
<section class="py-24">
  <div class="max-w-3xl mx-auto px-6">
    <!-- Hero -->
    <div class="mb-16 fade-in">
      <p class="text-sm font-medium text-indigo-500 tracking-wider uppercase mb-4">Get in Touch</p>
      <h1 class="font-display text-4xl md:text-5xl font-bold tracking-tight mb-6">
        Let's find <span class="gradient-text">the answer</span> together.
      </h1>
      <p class="text-slate-400 text-xl leading-relaxed">
        Whether you're exploring AI strategy, ready to build, or somewhere in between — we'd love to hear about your challenges.
      </p>
    </div>

    <!-- Contact Form -->
    <form action="https://formspree.io/f/placeholder" method="POST" class="space-y-6 fade-in">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="name" class="block text-sm font-medium text-slate-200 mb-2">Name</label>
          <input type="text" id="name" name="name" required
            class="w-full bg-navy-900 border border-navy-800 rounded-lg px-4 py-3 text-slate-50 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-colors"
            placeholder="Your name">
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-slate-200 mb-2">Email</label>
          <input type="email" id="email" name="email" required
            class="w-full bg-navy-900 border border-navy-800 rounded-lg px-4 py-3 text-slate-50 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-colors"
            placeholder="you@company.com">
        </div>
      </div>

      <div>
        <label for="company" class="block text-sm font-medium text-slate-200 mb-2">Company</label>
        <input type="text" id="company" name="company"
          class="w-full bg-navy-900 border border-navy-800 rounded-lg px-4 py-3 text-slate-50 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-colors"
          placeholder="Your company">
      </div>

      <div>
        <label for="message" class="block text-sm font-medium text-slate-200 mb-2">How can we help?</label>
        <textarea id="message" name="message" rows="5" required
          class="w-full bg-navy-900 border border-navy-800 rounded-lg px-4 py-3 text-slate-50 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-colors resize-y"
          placeholder="Tell us about your challenge or project..."></textarea>
      </div>

      <button type="submit" class="btn-gradient w-full md:w-auto">Send Message</button>
    </form>

    <!-- Alternative contact -->
    <div class="mt-16 pt-12 border-t border-navy-800 fade-in">
      <p class="text-slate-400 text-sm mb-4">Prefer a direct line?</p>
      <div class="flex flex-col sm:flex-row gap-6">
        <a href="mailto:{{ .Site.Params.email }}" class="text-slate-200 hover:text-indigo-400 transition-colors font-medium">
          {{ .Site.Params.email }}
        </a>
        <a href="https://linkedin.com/company/the42ai" class="text-slate-200 hover:text-indigo-400 transition-colors font-medium" target="_blank" rel="noopener">
          LinkedIn
        </a>
      </div>
    </div>
  </div>
</section>
{{ end }}
