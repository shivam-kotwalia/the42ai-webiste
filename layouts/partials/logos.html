<section class="logos-band">
  <div class="max-w-7xl mx-auto px-6">
    <p class="text-sm font-semibold text-teal-400 tracking-[0.24em] uppercase mb-8 text-center fade-in">Trusted by forward-thinking enterprises</p>
  </div>
  <div class="logos-track-outer fade-in">
    <div class="logos-track">
      <div class="logos-ticker">
        <!-- href="https://www.mckinsey.com" -->
        <span class="logo-item" aria-label="McKinsey &amp; Company">
          <img src="/images/logos/mckinsey.svg" alt="McKinsey &amp; Company" width="240" height="36" loading="lazy">
        </span>
        <!-- href="https://www.walmart.com" -->
        <span class="logo-item" aria-label="Walmart">
          <img src="/images/logos/walmart.svg" alt="Walmart" width="140" height="36" loading="lazy">
        </span>
        <!-- href="https://www.marriott.com" -->
        <span class="logo-item" aria-label="Marriott">
          <img src="/images/logos/marriott.svg" alt="Marriott" width="160" height="36" loading="lazy">
        </span>
        <!-- href="https://www.kimley-horn.com" -->
        <span class="logo-item" aria-label="Kimley-Horn">
          <img src="/images/logos/kimley-horn.svg" alt="Kimley-Horn" width="160" height="36" loading="lazy">
        </span>
        <!-- href="https://www.lennar.com" -->
        <span class="logo-item" aria-label="Lennar">
          <img src="/images/logos/lennar.svg" alt="Lennar" width="130" height="36" loading="lazy">
        </span>
        <!-- href="https://www.wonderful.com" -->
        <span class="logo-item" aria-label="The Wonderful Company">
          <img src="/images/logos/wonderful.svg" alt="The Wonderful Company" width="210" height="40" loading="lazy">
        </span>
      </div>
      <!-- Duplicate for seamless loop -->
      <div class="logos-ticker" aria-hidden="true">
        <span class="logo-item"><img src="/images/logos/mckinsey.svg" alt="" width="240" height="36" loading="lazy"></span>
        <span class="logo-item"><img src="/images/logos/walmart.svg" alt="" width="140" height="36" loading="lazy"></span>
        <span class="logo-item"><img src="/images/logos/marriott.svg" alt="" width="160" height="36" loading="lazy"></span>
        <span class="logo-item"><img src="/images/logos/kimley-horn.svg" alt="" width="160" height="36" loading="lazy"></span>
        <span class="logo-item"><img src="/images/logos/lennar.svg" alt="" width="130" height="36" loading="lazy"></span>
        <span class="logo-item"><img src="/images/logos/wonderful.svg" alt="" width="210" height="40" loading="lazy"></span>
      </div>
    </div>
  </div>
</section>
